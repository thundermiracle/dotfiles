onboarding = false

[ui.sound]
# 質問・承認待ち（blocked）の時だけ差し替え。完了音はデフォルトのまま
# sounds/request-voidoll.mp3: VOICEVOX:Voidoll(CV:丹下桜)（「質問があります」）
# herdr-app も同じ mp3 を使う（~/.config/herdr-app/settings.json の sounds.blocked）
request_path = "sounds/request-voidoll.mp3"

# herdr-file-viewer plugin
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-at"
description = "open file viewer at… (split)"   # asks for a directory in a popup

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-at-tab"
description = "open file viewer at… (tab)"     # same popup, opens a new tab
