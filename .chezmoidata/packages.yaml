packages:
  darwin:
    brews:
    - 'git'
    - 'git-lfs'
    - 'gh'
    - 'curl'
    - 'fnm'
    - 'awscli'
    - 'fish'
    brews_arm64:
    - 'podman'
    - 'docker-compose'
    - 'glow'
    - 'bat'
    - 'git-delta'
    # Intel Macs get glow and bat from .chezmoiexternal.toml. delta ships no
    # x86_64 macOS binary, so it is built with cargo (rustup) instead.
    cargo_amd64:
    - 'git-delta'
    casks:
    - 'zed'
    - 'kiro-cli'
    - 'codex'
    - 'slack'
    - 'hyper'
    - 'raycast'
    - '1password-cli'
    - '1password'
    # herdr-app ships Apple Silicon builds only. Intel Macs keep the herdr TUI
    # from .chezmoiexternal.toml.
    casks_arm64:
    - 'herdr-app'
    npm_globals:
    - '@antfu/ni'
    - 'aws-cdk'
    - 'skills'
    agent_skills:
    - repo: 'herdrdev/herdr'
      skill: 'herdr'
      agent: 'claude-code'
  # Wherever the herdr TUI runs: Intel Macs and Linux (VPS).
  # Apple Silicon Macs run herdr-app, which has no herdr plugins.
  herdr_plugins:
  - 'smarzban/herdr-file-viewer'
