[".oh-my-zsh"]
type = "archive"
url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
{{ if and (eq .chezmoi.os "darwin") (eq .chezmoi.arch "amd64") -}}
["bin/herdr"]
type = "file"
url = "https://github.com/herdrdev/herdr/releases/latest/download/herdr-macos-x86_64"
executable = true
refreshPeriod = "168h"
["bin/glow"]
type = "archive-file"
url = {{ gitHubLatestReleaseAssetURL "charmbracelet/glow" "glow_*_Darwin_x86_64.tar.gz" | quote }}
stripComponents = 1
path = "glow"
executable = true
["bin/bat"]
type = "archive-file"
url = {{ gitHubLatestReleaseAssetURL "sharkdp/bat" "bat-*-x86_64-apple-darwin.tar.gz" | quote }}
stripComponents = 1
path = "bat"
executable = true
{{ end -}}
{{ if and (eq .chezmoi.os "linux") (or (eq .chezmoi.arch "amd64") (eq .chezmoi.arch "arm64")) -}}
# VPS (Ubuntu, CentOS, ...): the herdr TUI. Its Linux builds are static, so one
# binary runs on every distribution.
["bin/herdr"]
type = "file"
url = "https://github.com/herdrdev/herdr/releases/latest/download/herdr-linux-{{ if eq .chezmoi.arch "arm64" }}aarch64{{ else }}x86_64{{ end }}"
executable = true
refreshPeriod = "168h"
{{ end -}}
